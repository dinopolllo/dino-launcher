name: release

# Publica los instaladores y, si hay clave de firma, el manifiesto que lee el updater.
#
# Las descargas van a un repo público aparte porque este es privado: el updater pide la
# URL sin autenticación y en un repo privado hasta las releases devuelven 404, así que
# ni el auto-update ni el reparto a mano funcionarían desde aquí.
#
# Se dispara con una etiqueta: `git tag v0.2.0 && git push --tags`.
#
# La firma es **opcional a propósito**. Sin los secretos se publican igual los
# instaladores —que es lo que hace falta para repartir el launcher— y se omite el
# `latest.json`; esas versiones se descargan a mano y no se auto-actualizan. Con los
# secretos puestos, se firma y se publica el manifiesto.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta a publicar, p. ej. v0.2.0"
        required: true

env:
  RELEASES_REPO: dinopolllo/dino-launcher-releases

jobs:
  construir:
    name: ${{ matrix.nombre }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: Windows
            plataforma: windows-x86_64
            args: ""
          # Universal como el motor: un solo archivo para Intel y Apple Silicon.
          - os: macos-latest
            nombre: macOS
            plataforma: darwin-universal
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Añadir los targets de macOS
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.plataforma }}

      # La versión del binario sale de tauri.conf.json, no de la etiqueta. Si no
      # coinciden, el updater ofrecería para siempre una versión que al instalarse
      # sigue diciendo que es la vieja.
      - name: Comprobar etiqueta y versión
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "v$VER" ]; then
            echo "::error::La etiqueta $TAG no coincide con la versión $VER de tauri.conf.json."
            exit 1
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: ¿Se puede firmar?
        id: firma
        shell: bash
        env:
          CLAVE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$CLAVE" ]; then
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin TAURI_SIGNING_PRIVATE_KEY: se publican los instaladores pero no el manifiesto, así que estas versiones no se auto-actualizan."
          elif grep -q "PEGA_AQUI_LA_CLAVE_PUBLICA" src-tauri/tauri.release.conf.json; then
            echo "::error::Hay clave privada pero falta la pública en src-tauri/tauri.release.conf.json."
            exit 1
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      # Con firma se añade `--config`, que es lo que activa `createUpdaterArtifacts`.
      # Esa bandera hace fallar la compilación si no hay clave, por eso no vive en el
      # tauri.conf.json de siempre.
      - name: Compilar
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          EXTRA=""
          [ "${{ steps.firma.outputs.hay }}" = "si" ] && EXTRA="--config src-tauri/tauri.release.conf.json"
          npm run build -- ${{ matrix.args }} $EXTRA

      # Los instaladores salen con espacios en el nombre y GitHub los convierte en
      # puntos al subirlos, con lo que la URL del manifiesto dejaría de coincidir con el
      # archivo real. Se renombran antes de tocar nada.
      - name: Recoger artefactos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          RAIZ=src-tauri/target
          [ -n "${{ matrix.args }}" ] && RAIZ=src-tauri/target/universal-apple-darwin

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            INSTALADOR=$(ls "$RAIZ"/release/bundle/nsis/*-setup.exe)
            NOMBRE="dino-launcher_${VERSION}_x64-setup.exe"
          else
            INSTALADOR=$(ls "$RAIZ"/release/bundle/dmg/*.dmg)
            NOMBRE="dino-launcher_${VERSION}_universal.dmg"
          fi
          cp "$INSTALADOR" "dist/$NOMBRE"
          echo "instalador -> $NOMBRE"

          # El updater no descarga el instalador en macOS: usa el .app.tar.gz. En
          # Windows sí es el propio .exe. Por eso lo que se firma no es lo mismo.
          if [ "${{ steps.firma.outputs.hay }}" = "si" ]; then
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              PAQUETE="$NOMBRE"; FIRMA=$(cat "$INSTALADOR.sig")
            else
              TGZ=$(ls "$RAIZ"/release/bundle/macos/*.app.tar.gz)
              PAQUETE="dino-launcher_${VERSION}_universal.app.tar.gz"
              cp "$TGZ" "dist/$PAQUETE"
              FIRMA=$(cat "$TGZ.sig")
            fi
            node -e '
              const fs = require("fs");
              const [plataforma, paquete, firma] = process.argv.slice(1);
              const { RELEASES_REPO, TAG } = process.env;
              fs.writeFileSync("dist/frag-" + plataforma + ".json", JSON.stringify({
                [plataforma]: {
                  signature: firma,
                  url: `https://github.com/${RELEASES_REPO}/releases/download/${TAG}/${paquete}`
                }
              }));
            ' "${{ matrix.plataforma }}" "$PAQUETE" "$FIRMA"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.plataforma }}
          path: dist/*
          if-no-files-found: error

  publicar:
    name: publicar
    needs: construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: recogido
      - name: Armar el release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VER" >> "$GITHUB_ENV"

          mkdir -p dist
          find recogido -type f ! -name 'frag-*.json' -exec cp {} dist/ \;

          # Copias con nombre fijo, sin la versión dentro. Son las que puede enlazar
          # cualquiera —`releases/latest/download/<nombre>`— sin que el enlace se rompa
          # al publicar la siguiente versión: es lo que permite que la página de
          # invitación ofrezca el instalador de verdad en vez de mandar a buscarlo a
          # GitHub. Los nombres con versión se quedan como están, que son los que firma
          # el updater y los que nombra `latest.json`.
          for f in dist/dino-launcher_*_x64-setup.exe; do
            [ -e "$f" ] && cp "$f" dist/DinoLauncher-Windows-setup.exe
          done
          for f in dist/dino-launcher_*_universal.dmg; do
            [ -e "$f" ] && cp "$f" dist/DinoLauncher-macOS.dmg
          done

          # Un solo latest.json con las dos plataformas dentro. Si ninguna se firmó,
          # no se escribe: es preferible no publicar manifiesto a publicar uno vacío,
          # que dejaría a los instalados comprobando algo que nunca les sirve.
          FRAGS=$(find recogido -name 'frag-*.json' | tr '\n' ' ')
          if [ -n "$FRAGS" ]; then
            # La versión se pasa al proceso de node aquí mismo. Lo escrito en
            # $GITHUB_ENV solo existe a partir del paso SIGUIENTE, así que leerla
            # de process.env en este mismo paso la deja en `undefined`, y
            # JSON.stringify borra las claves undefined: el manifiesto saldría sin
            # `version` y el updater se quedaría sin nada que comparar.
            VERSION="$VER" node -e '
              const fs = require("fs");
              const platforms = {};
              for (const f of process.argv.slice(1)) Object.assign(platforms, JSON.parse(fs.readFileSync(f, "utf8")));
              fs.writeFileSync("dist/latest.json", JSON.stringify({
                version: process.env.VERSION,
                notes: "Dino Launcher " + process.env.VERSION,
                pub_date: new Date().toISOString(),
                platforms
              }, null, 2) + "\n");
            ' $FRAGS
            echo "--- latest.json ---"; cat dist/latest.json

            # Un manifiesto incompleto no da error en ningún sitio: falla mucho
            # después, en la máquina de quien intente actualizar.
            node -e '
              const m = JSON.parse(require("fs").readFileSync("dist/latest.json", "utf8"));
              if (!m.version) { console.error("::error::latest.json sin version"); process.exit(1); }
              const n = Object.keys(m.platforms || {}).length;
              if (!n) { console.error("::error::latest.json sin plataformas"); process.exit(1); }
              console.log("manifiesto correcto: v" + m.version + ", " + n + " plataforma(s)");
            '
          else
            echo "sin firmas: no se publica manifiesto"
          fi
          ls -la dist

      # `latest.json` va como asset del release para que la URL
      # .../releases/latest/download/latest.json apunte siempre al más nuevo.
      - uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ env.TAG }}
          name: Dino Launcher ${{ env.VERSION }}
          files: dist/*
          fail_on_unmatched_files: true
