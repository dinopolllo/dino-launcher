name: release

# Publica una versión nueva y el manifiesto que lee el updater del launcher.
#
# Las descargas van a un repo público aparte porque este es privado y el updater
# pide la URL sin autenticación: no puede mandar credenciales, así que un release
# privado le devolvería un 404.
#
# Se dispara con una etiqueta: `git tag v0.2.0 && git push --tags`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta a publicar, p. ej. v0.2.0"
        required: true

env:
  # Repo público donde viven los instaladores y el latest.json.
  RELEASES_REPO: dinopolllo/dino-launcher-releases

jobs:
  windows:
    name: publicar Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Comprobar que la clave pública está puesta
        shell: bash
        run: |
          if grep -q "PEGA_AQUI_LA_CLAVE_PUBLICA" src-tauri/tauri.release.conf.json; then
            echo "::error::Falta la clave pública en src-tauri/tauri.release.conf.json."
            echo "Generala con: npm run tauri signer generate -- -w ~/.tauri/dino.key"
            exit 1
          fi

      # La versión del binario sale de tauri.conf.json, no de la etiqueta. Si no
      # coinciden, el updater ofrecería para siempre una versión que al instalarse
      # sigue diciendo que es la vieja: bucle infinito de "hay una versión nueva".
      - name: Comprobar que la etiqueta coincide con la versión
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "v$VER" ]; then
            echo "::error::La etiqueta $TAG no coincide con la versión $VER de tauri.conf.json."
            exit 1
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Compilar y firmar
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build -- --config src-tauri/tauri.release.conf.json

      # El instalador sale con espacios en el nombre y GitHub los convierte en puntos
      # al subirlo, con lo que la URL del manifiesto dejaría de coincidir con el
      # archivo real y el updater se descargaría un 404. Se renombra antes.
      - name: Preparar artefactos y manifiesto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          NOMBRE="dino-launcher_${VERSION}_x64-setup.exe"
          cp "$SRC" "dist/$NOMBRE"
          FIRMA=$(cat "$SRC.sig")

          node -e '
            const fs = require("fs");
            const { VERSION, TAG, RELEASES_REPO } = process.env;
            const nombre = process.argv[1], firma = process.argv[2];
            fs.writeFileSync("dist/latest.json", JSON.stringify({
              version: VERSION,
              notes: "Dino Launcher " + VERSION,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: firma,
                  url: `https://github.com/${RELEASES_REPO}/releases/download/${TAG}/${nombre}`
                }
              }
            }, null, 2) + "\n");
          ' "$NOMBRE" "$FIRMA"

          echo "--- latest.json ---"; cat dist/latest.json

      # `latest.json` se sube como asset del release: la URL
      # .../releases/latest/download/latest.json siempre apunta al más nuevo, que es
      # justo lo que espera el endpoint configurado en la app.
      - name: Publicar en el repo público
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ env.TAG }}
          name: Dino Launcher ${{ env.VERSION }}
          files: |
            dist/dino-launcher_${{ env.VERSION }}_x64-setup.exe
            dist/latest.json
          fail_on_unmatched_files: true
