[package]
name = "dino-auth"
description = "Cuentas de Dino 2.0: offline nativas y Microsoft a través del motor (puente)."
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
dino-core = { path = "../dino-core" }
dino-download = { path = "../dino-download" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
zip.workspace = true

# Solo para llevar al motor a su ventana de Microsoft (UI Automation y mensajes de ventana).
# Es la misma versión que ya compila Tauri: no añade compilación.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Accessibility",
  "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging",
] }
